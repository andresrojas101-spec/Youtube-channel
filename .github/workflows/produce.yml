name: Producir y subir episodios

on:
  push:
    branches: [main]
    paths: ["episodes/**/episode.json"]
  workflow_dispatch:
    inputs:
      episodio:
        description: "ID del episodio (vacío = todos los que estén en 'listo')"
        required: false
      sin_subir:
        description: "Solo renderizar, no subir a YouTube"
        type: boolean
        default: false

concurrency:
  group: produccion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg y dependencias
        timeout-minutes: 15
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: biblia-cache-v1-${{ github.run_id }}
          restore-keys: biblia-cache-v1-
      - name: Producir
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.episodio }}" ]; then ARGS="$ARGS --episodio ${{ inputs.episodio }}"; fi
          if [ "${{ inputs.sin_subir }}" = "true" ]; then ARGS="$ARGS --sin-subir"; fi
          python -m pipeline.produce $ARGS
      - name: Guardar estado en el repo
        if: always()
        run: |
          git config user.name "biblia-bot"
          git config user.email "biblia-bot@users.noreply.github.com"
          git add episodes
          git diff --cached --quiet || (git commit -m "Estado de producción [skip ci]" && git pull --rebase && git push)
      - name: Videos para revisar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            out/*/*.mp4
            out/*/miniatura.jpg
          retention-days: 14
          if-no-files-found: ignore
