name: Prueba de animación (Modal)

on:
  workflow_dispatch:
    inputs:
      pasos:
        description: "Pasos de difusión de Wan (más = mejor y más lento)"
        default: "30"

concurrency:
  group: gpu
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg, Modal y dependencias
        timeout-minutes: 15
        run: |
          curl -sSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"
          pip install -r requirements.txt modal==1.6.3
      - name: Generar clips en GPU (Modal)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run pipeline/gpu_modal.py::prueba --salida out/prueba --pasos ${{ inputs.pasos || '30' }}
      - name: Armar, subir y dejar hoja de revisión
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.prueba_video out/prueba
      - name: Guardar resultados
        if: always()
        run: |
          mkdir -p pruebas
          cp out/prueba/*.png pruebas/ 2>/dev/null || true
          git config user.name "biblia-bot"
          git config user.email "biblia-bot@users.noreply.github.com"
          git add pruebas
          git diff --cached --quiet || (git commit -m "Prueba de animación [skip ci]" && git pull --rebase && git push)
