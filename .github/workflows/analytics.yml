name: Métricas del canal

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días 6:17 a. m. Bogotá
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.analytics
      - run: |
          git config user.name "biblia-bot"
          git config user.email "biblia-bot@users.noreply.github.com"
          git add analytics
          git diff --cached --quiet || (git commit -m "Métricas $(date +%F) [skip ci]" && git pull --rebase && git push)
